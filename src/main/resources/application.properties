spring.application.name=spring-boot-pilot
server.port=8080

# In-memory H2 — restart pe data reset (demo ke liye perfect)
spring.datasource.url=jdbc:h2:mem:taskdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# Hibernate table banaye entity se
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Browser me DB dekhne ke liye: http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:taskdb   user: sa   password: (blank)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
